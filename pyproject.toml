[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netrr"
version = "0.2.0"
description = "Netrr: an assistive wearable for blind and low-vision users"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "opencv-python-headless",
    "numpy",
    "ultralytics",
    "Pillow",
    "requests",
    "SpeechRecognition",
    "python-dotenv",
    "edge-tts",
    "psutil",
    "google-genai",
]

[project.optional-dependencies]
pi = ["picamera2"]
jetson = ["jetson-stats"]
face = ["dlib", "face_recognition"]
dev = ["pytest"]

[project.scripts]
netrr = "smart_glasses.main:main"
netrr-doctor = "smart_glasses.doctor:main"

[tool.setuptools]
packages = ["smart_glasses", "netrr", "netrr.ground"]
